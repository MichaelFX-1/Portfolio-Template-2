<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumen — Portfolio Template</title>
  <meta name="description" content="A bright, playful, fully editable portfolio template with 3D motion." />
  <meta property="og:title" content="Lumen — Portfolio Template" />
  <meta property="og:description" content="A bright, playful, fully editable portfolio template with 3D motion." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 3D Scene background (decorative, fixed under content) -->
  <div class="scene3d" aria-hidden="true">
    <div class="scene-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="ring">
      <div class="ring-dot"></div>
    </div>
  </div>

  <!-- Top toolbar -->
  <header class="toolbar-wrap">
    <div class="toolbar-row">
      <div class="brand glass shadow-soft pop-in">
        <div class="brand-mark"></div>
        <span class="brand-name">Lumen</span>
        <span class="chip">Template</span>
      </div>
      <div class="actions glass shadow-soft pop-in">
        <button class="icon-btn" data-action="theme" aria-label="Toggle theme" title="Toggle theme">
          <svg id="iconTheme" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" data-action="export" aria-label="Export" title="Export portfolio JSON">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" data-action="import" aria-label="Import" title="Import portfolio JSON">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
        </button>
        <input id="importInput" type="file" accept="application/json" hidden />
        <button class="icon-btn" data-action="reset" aria-label="Reset" title="Reset to defaults">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="edit-btn" data-action="edit">
          <svg id="iconEdit" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span id="editLabel">Edit</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- HERO -->
    <section class="hero">
      <div class="float-shape cube hero-cube" style="--c: var(--blob-1)"></div>
      <div class="float-shape ring2 hero-ring" style="--c: var(--blob-2)"></div>
      <div class="float-shape sphere hero-sphere" style="--c: var(--blob-3)"></div>

      <div class="hero-text reveal">
        <div class="badge">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8H20l-4.9 3.6L17 18l-5-3.6L7 18l1.9-5.6L4 8.8h6.1L12 3z"/></svg>
          Available for new projects
        </div>
        <h1 class="display-1">
          <span class="block">Hi, I'm</span>
          <span class="editable text-gradient" data-bind="name" data-as="span"></span>
        </h1>
        <p class="lead editable" data-bind="title" data-as="p"></p>
        <p class="tagline editable" data-bind="tagline" data-as="p" data-multiline="1"></p>

        <div class="hero-cta">
          <a id="ctaEmail" class="btn-primary" href="mailto:#">
            Get in touch
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
          </a>
          <a class="btn-glass" href="#work">View work</a>
        </div>

        <div class="stats" id="stats"></div>
      </div>

      <div class="hero-card reveal">
        <div class="avatar-card">
          <div class="avatar-inner">
            <img id="avatarImg" alt="" hidden />
            <span id="avatarInitials" class="avatar-initials"></span>
            <button id="avatarBtn" class="upload-btn" hidden>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Photo
            </button>
            <input id="avatarInput" type="file" accept="image/*" hidden />
          </div>
          <div class="avatar-deco-tl"></div>
          <div class="avatar-deco-br"></div>
        </div>

        <div class="socials" id="socials"></div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section reveal" data-accent="var(--blob-2)">
      <div class="section-head"><span class="dot"></span><span class="label">About</span><span class="rule"></span></div>
      <p class="about editable" data-bind="about" data-as="p" data-multiline="1"></p>
    </section>

    <!-- EXPERIENCE -->
    <section class="section reveal" data-accent="var(--blob-1)">
      <div class="section-head"><span class="dot"></span><span class="label">Experience</span><span class="rule"></span></div>
      <div class="stack" id="experienceList"></div>
    </section>

    <!-- EDUCATION -->
    <section class="section reveal" data-accent="var(--blob-3)">
      <div class="section-head"><span class="dot"></span><span class="label">Education</span><span class="rule"></span></div>
      <div class="stack" id="educationList"></div>
    </section>

    <!-- SKILLS -->
    <section class="section reveal" data-accent="var(--accent)">
      <div class="section-head"><span class="dot"></span><span class="label">Skills</span><span class="rule"></span></div>
      <div class="skills" id="skillsList"></div>
    </section>

    <!-- PROJECTS -->
    <section id="work" class="section reveal" data-accent="var(--primary)">
      <div class="section-head"><span class="dot"></span><span class="label">Selected Work</span><span class="rule"></span></div>
      <div class="grid-2" id="projectsList"></div>
      <div id="addProjectWrap" class="mt16" hidden></div>
    </section>

    <!-- CONTACT -->
    <section class="section reveal" data-accent="var(--blob-2)">
      <div class="section-head"><span class="dot"></span><span class="label">Contact</span><span class="rule"></span></div>
      <div class="contact glass shadow-pop">
        <div class="float-shape sphere contact-sphere" style="--c: var(--blob-1)"></div>
        <div class="float-shape pill contact-pill" style="--c: var(--blob-2)"></div>
        <h3 class="display-2">Let's build something <span class="text-gradient">bright</span>.</h3>
        <div class="contact-grid" id="contactGrid"></div>
      </div>
    </section>

    <footer class="footer">
      Built with the Lumen template — fully editable on
      <a href="https://mypow.app">mypow.app</a>
    </footer>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
